name: Isle
options:
  bundleIdPrefix: dev.isle
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Самоподписанный сертификат из связки «вход» — чтобы macOS
    # не сбрасывала разрешения (камера, запись экрана) после каждой сборки.
    CODE_SIGN_IDENTITY: "Isle Dev"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  Isle:
    type: application
    platform: macOS
    sources:
      - Isle
      # Скрипт адаптера «Исполняется» — кладём в Resources приложения.
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      # Фреймворк адаптера: копируется в Contents/Frameworks, но НЕ линкуется —
      # его загружает /usr/bin/perl (scripts/build-mediaremote-adapter.sh).
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    info:
      path: Isle/Info.plist
      properties:
        CFBundleDisplayName: Isle
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "Запасной способ узнать, что играет в Spotify и Музыке, если основной не сработал."
        NSCameraUsageDescription: "Isle показывает камеру как зеркало во вкладке «Камера»."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.isle.Isle
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Isle:
    build:
      targets:
        Isle: all
    run:
      config: Debug
